name: stars-and-clounds

services: 
  client: 
    build: client
    ports: 
      - 8443:8443
      - 8080:8080 
    networks:
      - frontend

  apiv1:
    build: api
    expose: 
    -  4000
    deploy:
      replicas: 3
    networks:
      - backend
      - deepback
    depends_on:
      - mysqldb
  
  proxy:
    build: proxy
    ports:
     - 443:443
     - 80:80
    networks:
      - backend
      - frontend
    depends_on:
      - apiv1

  mysqldb: 
    build: mysql_db
    ports:
      - 3307:3306
    networks:
      - deepback

networks:
    frontend:
      driver: bridge
    backend:  
      driver: bridge
    deepback:
      driver: bridge
